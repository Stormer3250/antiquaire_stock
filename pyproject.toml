[project]
name = "antiquaire"
version = "1.0.0"
description = "L'Antiquaire — gestion de cave, coûts et prix pour le bar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antiquaire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Les specs et plans contiennent des extraits illustratifs, pas du code à formater.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Body(...) en valeur par défaut est l'idiome FastAPI
"src/antiquaire/api.py" = ["B008"]
"src/antiquaire/api_admin.py" = ["B008"]
