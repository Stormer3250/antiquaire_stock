<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Antiquaire — Cave &amp; comptoir</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='none' stroke='%2379A63A' stroke-width='4'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%2379A63A' font-family='Georgia,serif'>A</text></svg>">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="banner" hidden></div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-txt">
        <div class="brand-name">L'Antiquaire</div>
        <div class="brand-sub">Cave &amp; comptoir</div>
      </div>

    </div>
    <nav class="side-nav" id="nav"></nav>
    <button class="pin" id="btn-epingle" aria-label="Déplier la barre" aria-pressed="false"></button>
    <div class="side-foot">
      <div class="mono-label">Objectif de marge</div>
      <div class="side-foot-line" id="marge-note"></div>
      <div class="build-stamp" id="build-stamp"></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title"></h1>
        <div class="subtitle" id="page-sub"></div>
      </div>
      <div class="seg" id="lieu-seg"></div>
      <button class="btn ghost" id="btn-palette" title="Rechercher (⌘K)" aria-label="Rechercher">⌘K</button>
      <button class="btn ghost" id="btn-tour" title="Visite guidée de cet écran" aria-label="Visite guidée">?</button>
      <button class="btn" id="btn-reception">Réception</button>
      <button class="btn" id="btn-new-ref">+ Référence</button>
      <div class="user-chip">
        <div class="user-mark">A</div>
        <div class="user-name">L'Antiquaire</div>
      </div>
    </header>
    <div class="screen" id="screen"></div>
  </main>
</div>
<div id="modal-root"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
